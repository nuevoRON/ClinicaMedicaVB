name: Build ClinicaMedicaVB

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ClinicaMedicaVB.vbproj

      - name: Build
        run: dotnet build ClinicaMedicaVB.vbproj --configuration Release --no-restore
